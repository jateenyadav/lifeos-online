name: lifeos_mobile
description: LifeOS shared-account login for Android and iOS.
publish_to: none
version: 0.2.0+2
environment:
  sdk: ^3.11.0
dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  google_sign_in: ^7.2.0
  flutter_secure_storage: ^11.2.0
  fl_chart: ^1.3.1
  google_mlkit_text_recognition: ^0.16.0
  image_picker: ^1.2.4
  image: ^4.7.2
  crypto: ^3.0.8
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-600.ttf
          weight: 600
        - asset: assets/fonts/Sora-700.ttf
          weight: 700
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
