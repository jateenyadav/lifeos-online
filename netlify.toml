# Netlify hosts the React website (apps/web).
# The Express API stays on Render. Netlify forwards /api/* to it, so the
# browser only ever talks to one address and the login cookie stays first-party.
# Add this site's exact address to WEB_ORIGINS on Render, or sign-in is refused.

[build]
  command = "npm run build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_API_URL = "/api"

[[redirects]]
  from = "/api/*"
  to = "https://lifeos-api-fuj5.onrender.com/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    # Same values as the Vite dev server: the Google sign-in popup needs them.
    Referrer-Policy = "no-referrer-when-downgrade"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
